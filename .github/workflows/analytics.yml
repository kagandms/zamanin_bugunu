name: Zamanın Bugünü analytics only

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Optional external trigger identity; not authorization'
        required: false
        default: ''
        type: string
      correlation_id:
        description: 'Deterministic external occurrence ID'
        required: false
        default: ''
        type: string
      intended_at:
        description: 'Intended UTC occurrence (RFC3339 Z)'
        required: false
        default: ''
        type: string
      intended_day:
        description: 'Publication Istanbul day, YYYY-MM-DD'
        required: false
        default: ''
        type: string
      intended_slot:
        description: 'Publication morning/evening; empty for analytics'
        required: false
        default: ''
        type: string

run-name: '${{ github.workflow }} | ${{ inputs.correlation_id || github.event_name }}'

# Every workflow writing bot_data.db shares this lock before its checkout.
concurrency:
  group: zamanin-bugunu-db
  queue: max
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZAMANIN_DB_PERSISTENCE: git
      PYTHONPATH: .
      ZAMANIN_TRIGGER_SOURCE: ${{ inputs.trigger_source || '' }}
      ZAMANIN_CORRELATION_ID: ${{ inputs.correlation_id || '' }}
      ZAMANIN_INTENDED_AT: ${{ inputs.intended_at || '' }}
      ZAMANIN_INTENDED_DAY: ${{ inputs.intended_day || '' }}
      ZAMANIN_INTENDED_SLOT: ${{ inputs.intended_slot || '' }}
    steps:
      - name: Checkout current main after acquiring DB lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh database from current main
        run: |
          git fetch origin main
          git switch --detach origin/main
          echo "ZAMANIN_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect due measurements and expire unclaimed slots
        env:
          ZAMANIN_ANALYTICS_CLI: '1'
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python -m src.analytics
      - name: Save Database measurements without publishing
        if: always()
        run: python -m src.database_checkpoint --phase analytics
