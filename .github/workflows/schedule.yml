name: Zamanın Bugünü publication slots

on:
  schedule:
    # First nominal check is ten minutes after the 09:07 / 20:07 Istanbul target.
    - cron: '17 6,7,17,18 * * *'
  workflow_dispatch:

# Every workflow writing bot_data.db shares this lock before its checkout.
concurrency:
  group: zamanin-bugunu-db
  queue: max
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZAMANIN_DB_PERSISTENCE: git
      PYTHONPATH: .
    steps:
      - name: Checkout current main after acquiring DB lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh database from current main
        run: |
          git fetch origin main
          git switch --detach origin/main
          echo "ZAMANIN_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Publish only an eligible persisted slot
        env:
          ZAMANIN_SCHEDULE: ${{ github.event.schedule || 'unknown' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.main
      - name: Save Database results without binary conflict resolution
        if: always()
        run: python -m src.database_checkpoint --phase result
